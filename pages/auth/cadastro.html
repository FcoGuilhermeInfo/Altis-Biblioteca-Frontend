<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | LocBooks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/auth/cadastro.css">
</head>
<body>
  <main class="cadastro-page">
    <section class="cadastro-panel">
      <h1>Cadastro</h1>

      <form class="cadastro-form">
        <label class="input-group"><img src="../../assets/icon-usuario.png" alt="">
          <input type="text" name="nome" placeholder="Nome Completo" required>
        </label>
        <label class="input-group"><img src="../../assets/icon-data.png" alt="">
          <input type="date" name="nascimento" placeholder="Data de Nascimento" required>
        </label>
        <label class="input-group"><img src="../../assets/icon-cpf.png" alt="">
          <input type="text" name="cpf" placeholder="CPF" required>
        </label>
        <label class="input-group"><img src="../../assets/icon-telefone.png" alt="">
          <input type="tel" name="telefone" placeholder="Telefone" required>
        </label>
        <label class="input-group"><img src="../../assets/icon-endereco.png" alt="">
          <input type="text" name="endereco" placeholder="Endereço" required>
        </label>
        <label class="input-group"><img src="../../assets/icon-email.png" alt="">
          <input type="email" name="email" placeholder="E-mail" autocomplete="email" required>
        </label>
        <label class="input-group"><img src="../../assets/icon-senha.png" alt="">
          <input type="password" name="senha" placeholder="Senha"  required>
        </label>
        <label class="input-group"><img src="../../assets/icon-senha.png" alt="">
          <input type="password" name="confirmar-senha" placeholder="Confirmar Senha" required>
        </label>

        <button type="submit" id="register-submit">Cadastrar-se</button>
      </form>

      <a class="login-link" href="login.html">Já tem uma conta?</a>
    </section>

    <aside class="brand-panel">
      <img src="../../assets/logo-locbooks.png" alt="LocBooks">
      <h2>LocBooks</h2>
    </aside>
  </main>

  <script src="../../js/auth/cadastro.js"></script>
  <script src="../../js/shared/masks.js"></script>
</body>
</html>
