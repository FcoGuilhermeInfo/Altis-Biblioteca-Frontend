<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários | LocBooks</title>
    <link rel="stylesheet" href="../../css/shared/navigation.css">
    <link rel="stylesheet" href="../../css/admin/usuarios.css">
</head>
<body>
    <div class="users-page">
        <header class="topbar">
            <a class="topbar-logo" href="dashboard.html" aria-label="LocBooks">
                <img src="../../assets/logo-locbooks.png" alt="LocBooks">
            </a>
            <div class="profile-area">
                <button class="profile-menu" type="button" aria-label="Abrir menu do usuário" aria-expanded="false" aria-controls="profile-panel">
                    <span class="profile-chevron" aria-hidden="true"></span>
                    <img class="profile-icon" src="../../assets/icon-perfil.svg" alt="">
                </button>
            </div>
        </header>

        <aside class="profile-panel" id="profile-panel" aria-hidden="true">
            <div class="profile-panel-header">
                <img src="../../assets/icon-perfil.svg" alt="">
                <strong class="profile-name"></strong>
            </div>
            <nav class="profile-nav" aria-label="Menu do usuário">
                <a href="perfil.html"><img src="../../assets/icon-perfil-menu.svg" alt=""><span>Perfil</span></a>
                <a href="#idioma"><img src="../../assets/icon-idioma.svg" alt=""><span>Alterar Idioma</span></a>
                <button class="logout-button" type="button"><img src="../../assets/icon-logout.svg" alt=""><span>Logout</span></button>
            </nav>
        </aside>

        <aside class="sidebar">
            <nav class="main-nav" aria-label="Navegação principal">
                <a class="nav-item" href="dashboard.html"><img class="nav-icon" src="../../assets/icon-home.svg" alt=""><span>Dashboard</span></a>
                <a class="nav-item" href="emprestimos.html"><img class="nav-icon" src="../../assets/icon-emprestimos.svg" alt=""><span>Empréstimos</span></a>
                <a class="nav-item active" href="usuarios.html" aria-current="page"><img class="nav-icon" src="../../assets/icon-usuarios.svg" alt=""><span>Usuários</span></a>
                <a class="nav-item" href="editoras.html"><img class="nav-icon" src="../../assets/icon-editoras.svg" alt=""><span>Editoras</span></a>
                <a class="nav-item" href="livros.html"><img class="nav-icon" src="../../assets/icon-livros.svg" alt=""><span>Livros</span></a>
            </nav>
        </aside>

        <main class="users-content">
            <h1>Usuários</h1>
            <section class="users-panel" aria-label="Gerenciamento de usuários">
                <div class="users-toolbar">
                    <label class="search-box">
                        <span class="search-icon" aria-hidden="true"></span>
                        <input type="search" placeholder="Buscar Usuário por Nome" aria-label="Buscar usuário por nome">
                    </label>
                    <button class="add-user-button" type="button"><span aria-hidden="true">+</span> Cadastrar novo usuário</button>
                </div>

                <div class="users-table-wrapper">
                    <table class="users-table">
                        <thead>
                            <tr><th>Nome</th><th>CPF</th><th>E-Mail</th><th>Telefone</th><th>Status</th><th>Ações</th></tr>
                        </thead>
                        <tbody id="users-table-body"></tbody>
                    </table>
                </div>

                <footer class="users-footer">
                    <span class="users-count"></span>
                    <nav class="pagination" aria-label="Paginação de usuários"></nav>
                </footer>
            </section>
        </main>

        <div class="user-modal-overlay" aria-hidden="true">
            <section class="user-modal" role="dialog" aria-modal="true" aria-labelledby="user-modal-title">
                <button class="user-modal-close" type="button" aria-label="Fechar cadastro">&times;</button>
                <h2 id="user-modal-title">Cadastrar Locatário</h2>

                <form class="user-modal-form">
                    <label class="modal-field modal-field-wide">
                        <img src="../../assets/icon-usuario.png" alt="">
                        <input type="text" name="nome" placeholder="Nome Completo">
                    </label>
                    <label class="modal-field modal-field-wide">
                        <img src="../../assets/icon-email.png" alt="">
                        <input type="email" name="email" placeholder="E-mail">
                    </label>
                    <div class="modal-field-row">
                        <label class="modal-field">
                            <img src="../../assets/icon-cpf.png" alt="">
                            <input type="text" name="cpf" placeholder="CPF">
                        </label>
                        <label class="modal-field">
                            <img src="../../assets/icon-data.png" alt="">
                            <input type="date" name="nascimento" placeholder="Data de Nascimento">
                        </label>
                        <label class="modal-field">
                            <img src="../../assets/icon-telefone.png" alt="">
                            <input type="tel" name="telefone" placeholder="Telefone">
                        </label>
                    </div>
                    <label class="modal-field modal-field-wide">
                        <img src="../../assets/icon-endereco.png" alt="">
                        <input type="text" name="endereco" placeholder="Endereço">
                    </label>
                    <label class="modal-field modal-field-wide">
                        <img src="../../assets/icon-senha.png" alt="">
                        <input type="password" name="senha" placeholder="Senha">
                        <img class="eye-icon" src="../../assets/icon-olho.png" alt="Mostrar senha">
                    </label>
                    <label class="modal-field modal-field-wide">
                        <img src="../../assets/icon-senha.png" alt="">
                        <input type="password" name="confirmar-senha" placeholder="Confirmar Senha">
                        <img class="eye-icon" src="../../assets/icon-olho.png" alt="Mostrar senha">
                    </label>
                    <button class="modal-submit" type="submit">Cadastrar</button>
                </form>
            </section>
        </div>
    </div>
    <script src="../../js/shared/navigation.js"></script>
    <script>initializeNavigation();</script>
    <script src="../../js/admin/usuarios.js"></script>
    <script src="../../js/shared/masks.js"></script>
</body>
</html>
