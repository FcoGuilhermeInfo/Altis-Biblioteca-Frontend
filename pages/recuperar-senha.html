<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar senha | LocBooks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/recuperar-senha.css">
</head>
<body>
  <main class="recovery-page">
    <section class="recovery-panel">
      <h1>Esqueceu sua senha?</h1>

      <form class="recovery-form">
        <label class="input-group"><img src="../assets/icon-email.png" alt=""><input type="email" name="email" placeholder="E-mail" autocomplete="email" required></label>
        <label class="input-group"><img src="../assets/icon-cpf.png" alt=""><input type="text" name="cpf" placeholder="CPF" required></label>
        <button type="submit">Confirmar</button>
      </form>

      <div class="divider"><span>ou</span></div>
      <a class="back-link" href="login.html"><span aria-hidden="true">←</span> voltar para a tela de login</a>
    </section>

    <aside class="brand-panel">
      <img src="../assets/logo-locbooks.png" alt="LocBooks">
      <h2>LocBooks</h2>
    </aside>
  </main>
</body>
</html>
