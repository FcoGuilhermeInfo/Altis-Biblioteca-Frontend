<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alterar senha | LocBooks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/auth/alterar-senha.css">
</head>
<body>
  <main class="change-page">
    <section class="change-panel">
      <header>
        <a class="back-button" href="recuperar-senha.html" aria-label="Voltar">←</a>
        <h1>Alterar Senha</h1>
      </header>

      <p class="user-name"><strong>Usuário:</strong> teste</p>

      <form class="change-form">
        <label class="input-group"><img src="../../assets/icon-senha.png" alt="">
          <input type="password" name="password" placeholder="Senha" autocomplete="new-password" required>
        </label>
        <label class="input-group"><img src="../../assets/icon-senha.png" alt="">
          <input type="password" name="confirm-password" placeholder="Confirmar Senha" autocomplete="new-password" required>
        </label>
        <button type="submit">Alterar</button>
      </form>
    </section>

    <aside class="brand-panel">
      <img src="../../assets/logo-locbooks.png" alt="LocBooks">
      <h2>LocBooks</h2>
    </aside>
  </main>

  <script src="../../js/auth/alterar-senha.js"></script>
</body>
</html>
